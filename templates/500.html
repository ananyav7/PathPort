<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | PathPort</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <div class="login-container fade-in" style="text-align: center; max-width: 500px;">
        <div class="login-header">
            <h1 style="font-size: 5rem; color: var(--danger); margin: 0; line-height: 1;">500</h1>
            <h2 style="margin-top: 1rem;"><i class="fas fa-exclamation-triangle"></i> System Hiccup</h2>
            <p>Something went wrong on our end while processing your delivery request.</p>
        </div>
        <div class="login-body">
            <p style="color: var(--text-muted); margin-bottom: 2rem;">
                Our dispatch engineers have been alerted. Please try refreshing the page or check back shortly.
            </p>
            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                <a href="{{ url_for('index') }}" class="btn btn-primary">
                    <i class="fas fa-home"></i> Back to Home
                </a>
                <button onclick="window.location.reload()" class="btn btn-secondary">
                    <i class="fas fa-redo"></i> Retry
                </button>
            </div>
        </div>
        <div class="login-footer">
            <p>Need urgent assistance? Contact <strong>support@pathport.com</strong></p>
        </div>
    </div>
</body>
</html>
