<!-- Toast Notification Container positioned safely below navbar -->
{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div class="toast-container" id="toast-container" role="status" aria-live="polite">
            {% for category, message in messages %}
                <div class="alert alert-{{ 'success' if category in ['success', 'info'] else 'error' }} fade-in">
                    <i class="fas {{ 'fa-check-circle' if category == 'success' else ('fa-info-circle' if category == 'info' else 'fa-exclamation-triangle') }}"></i>
                    <span style="flex: 1;">{{ message }}</span>
                    <button type="button" class="alert-close-btn" onclick="this.parentElement.remove()" title="Dismiss notification" aria-label="Close notification">&times;</button>
                </div>
            {% endfor %}
        </div>
        <script>
            setTimeout(function() {
                const container = document.getElementById('toast-container');
                if (container) {
                    const alerts = container.querySelectorAll('.alert');
                    alerts.forEach(alert => {
                        alert.style.opacity = '0';
                        alert.style.transform = 'translateY(-10px)';
                        setTimeout(() => alert.remove(), 350);
                    });
                }
            }, 4000);
        </script>
    {% endif %}
{% endwith %}
